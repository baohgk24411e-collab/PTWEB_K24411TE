<html>
    <head>
        <title>Tiêu đề trang</title>
        <script type="text/javascript">
            function XulyGiai(a,b,kq)
            {
                if (a==0)
                {
                    if (b==0)
                    {
                        kq.value="Phương trình vô số nghiệm"
                    }
                    else
                    {
                        kq.value="Phương trình vô nghiệm"
                    }
                }
                else
                {
                    nghiem=-b/a
                    kq.value="Phương trình có nghiệm: " + nghiem
                }
            }

        </script>
    </head>
    <body>
        <form>
            <tr>
                <td colspan="2">Phương trình bậc 1</td>
            </tr>
            <tr>
                <td>Hệ số a:</td>
                <td><input type="number" id="hsa"/></td>
            </tr>
            <tr>
                <td>Hệ số b:</td>
                <td><input type="number" id="hsb"/></td>
            </tr>
            <tr>
                <td>Kết quả:</td>
                <td><input type="text" id="kq"/></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="button" value="Giải phương trình"
                    onclick="XulyGiai(hsa.value,hsb.value,kq)">
                    &nbsp;
                    <input type="button" value="Thoát">
                </td>
            </tr>
    </body>
</html>
