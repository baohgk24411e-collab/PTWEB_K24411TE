<html>
    <head>
        <title>Tiêu đề trang</title>
        <style>
            table {
                border-collapse: separate;
                border-spacing: 0 5px;
            }
            tr td {
                padding: 5px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body style="background-color:rgb(11, 108, 85)">
        <div style="text-align: center;">
            <img src="images/Logo.gif" alt="Logo" style="display: block; margin: auto;">
        </div>
        <h1 style="font-family: Arial, sans-serif; text-align: center; color: white;">
            Newborn Registration</h1>
        <table style="color: white;">
            <tr>
                <td>
                    Date:
                    <input type="date" name="date">
                </td>
            </tr>
            <tr>
                <td>
                    1. Infant's First Name:
                    <input type="text" name="first_name">
                </td>
                <td>
                    Last:
                    <input type="text" name="last_name">
                </td>
            </tr>
            <tr>
                <td>
                    2. Medical Record #:
                    <input type="text" name="medical_record">
                </td>
            </tr>
            <tr>
                <td>
                    3. Date of Birth:
                    <input type="date" name="dob">
                </td>
            </tr>
            <tr>
                <td>
                    4. Birth weight:
                    <input type="text" name="birth_weight">
                </td>
            </tr>
            <tr>
                <td>
                    5. APGAR Score:
                    <input type="text" name="apgar_score">
                </td>
            </tr>
            <tr>
                <td>
                    6. Mother's First Name:
                    <input type="text" name="mother_first_name">
                </td>
                <td>
                    Last:
                    <input type="text" name="mother_last_name">
                </td>
            </tr>
            <tr>
                <td>
                    7. Father's First Name:
                    <input type="text" name="father_first_name">
                </td>
                <td>
                    Last:
                    <input type="text" name="father_last_name">
                </td>
            </tr>
            <tr>
                <td>
                    8. Physician (check all that apply):
                    <select size="4">
                        <option value="Dr. Warren Albert">Dr. Warren Albert</option>
                        <option value="Dr. Maria Alvarez">Dr. Maria Alvarez</option>
                        <option value="Dr. Karen Brinkman">Dr. Karen Brinkman</option>
                        <option value="Dr. Michael Kerry">Dr. Michael Kerry</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="text-align: center;">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </body>
</html>
