<html>
    <head>
        <title>Tiêu đề trang</title>
        <script>
            function CalculateTotal() {
                quantity1 = MyForm.quantity1.value
                quantity2 = MyForm.quantity2.value
                quantity3 = MyForm.quantity3.value
                total = quantity1 * 19.95 + quantity2 * 29.95 + quantity3 * 39.95
                MyForm.total.value = total.toFixed(2) + "$"
                MyForm.item1.value = quantity1 * 19.95 > 0 ?  + (quantity1 * 19.95).toFixed(2) + "$" : ""
                MyForm.item2.value = quantity2 * 29.95 > 0 ?  + (quantity2 * 29.95).toFixed(2) + "$" : ""
                MyForm.item3.value = quantity3 * 39.95 > 0 ?  + (quantity3 * 39.95).toFixed(2) + "$" : ""
            }
        </script>
    </head>
    <body>
        <form name="MyForm">
            <table width="50%" style="border: 1px solid black">
                <tr>
                    <thead>
                        <td>Part Number</td>
                        <td>Description</td>
                        <td>Price</td>
                        <td width="20%">Quantity</td>
                        <td width="20%">Item Table</td>
                    </thead>
                </tr>
                <tr>
                    <td>C112</td>
                    <td>Mouse</td>
                    <td>19.95$</td>
                    <td><input type="number" name="quantity1" min="0" value="0"></td>
                    <td><input type="text" name="item1" readonly></td>
                </tr>
                <tr>
                    <td>B124</td>
                    <td>Keyboard US</td>
                    <td>29.95$</td>
                    <td><input type="number" name="quantity2" min="0" value="0"></td>
                    <td><input type="text" name="item2" readonly></td>
                </tr>
                <tr>
                    <td>U125</td>
                    <td>USB KingMax</td>
                    <td>39.95$</td>
                    <td><input type="number" name="quantity3" min="0" value="0"></td>
                    <td><input type="text" name="item3" readonly></td>
                </tr>
                <tr>
                    <td colspan="5"><hr></td>
                </tr>
                <tr>
                    <td colspan="5" style="text-align: right">
                        Total:
                        <input type="text" name="total" readonly>
                    </td>
                </tr>
                <tr>
                    <td colspan="5" style="text-align: right">
                        <button type="button" onclick="CalculateTotal()"
                        style="background-color: orange; padding: 3px 10px 3px 10px; color: white; border: 2px solid rgb(168, 110, 9);">Sum</button>
                    </td>
                </tr>

            </table>
        </form>
    </body>
</html>
