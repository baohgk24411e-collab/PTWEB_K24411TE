<html>
    <head>
        <title>Tiêu đề trang</title>
    </head>
    <body>
        <form name="MyForm">
            <table width="50%" style="border: 1px solid black">
                <tr>
                    <thead>
                        <td>Part Number</td>
                        <td>Description</td>
                        <td>Price</td>
                        <td width="20%">Quantity</td>
                        <td width="20%">Item Table</td>
                    </thead>
                </tr>
                <tr>
                    <td>C112</td>
                    <td>Mouse</td>
                    <td id="price1">19.95$</td>
                    <td><input type="number" name="quantity1" min="0" value="0" onchange="UpdateItem(1)"></td>
                    <td><input type="text" name="item1" readonly></td>
                </tr>
                <tr>
                    <td>B124</td>
                    <td>Keyboard US</td>
                    <td id="price2">29.95$</td>
                    <td><input type="number" name="quantity2" min="0" value="0" onchange="UpdateItem(2)"></td>
                    <td><input type="text" name="item2" readonly></td>
                </tr>
                <tr>
                    <td>U125</td>
                    <td>USB KingMax</td>
                    <td id="price3">39.95$</td>
                    <td><input type="number" name="quantity3" min="0" value="0" onchange="UpdateItem(3)"></td>
                    <td><input type="text" name="item3" readonly></td>
                </tr>
                <tr>
                    <td colspan="5"><hr></td>
                </tr>
                <tr>
                    <td colspan="5" style="text-align: right">
                        Total:
                        <input type="text" name="total" readonly>
                    </td>
                </tr>
                <tr>
                    <td colspan="5" style="text-align: right">
                        <button type="button" onclick="CalculateTotal()"
                        style="background-color: orange; padding: 3px 10px 3px 10px; color: white; border: 2px solid rgb(168, 110, 9);">Sum</button>
                    </td>
                </tr>

            </table>
        </form>
        <script>
            function UpdateItem(itemNum) {
                quantity = MyForm['quantity' + itemNum].value
                priceElement = document.getElementById('price' + itemNum)
                priceVal = parseFloat(priceElement.innerHTML) || 0
                itemValue = quantity * priceVal
                MyForm['item' + itemNum].value = itemValue > 0 ? itemValue.toFixed(2) + "$" : ""
            }
            
            function CalculateTotal() {
                item1Val = parseFloat(MyForm.item1.value) || 0
                item2Val = parseFloat(MyForm.item2.value) || 0
                item3Val = parseFloat(MyForm.item3.value) || 0
                total = item1Val + item2Val + item3Val
                MyForm.total.value = total.toFixed(2) + "$"
            }
        </script>
    </body>
</html>
